<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Protein">
<title>Protein Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* === TOKENS === */
:root {
  --font-body: 'DM Sans', system-ui, sans-serif;
  --font-mono: 'DM Mono', monospace;

  --text-xs:   clamp(0.75rem,  0.7rem  + 0.25vw, 0.875rem);
  --text-sm:   clamp(0.875rem, 0.8rem  + 0.35vw, 1rem);
  --text-base: clamp(1rem,     0.95rem + 0.25vw, 1.125rem);
  --text-lg:   clamp(1.125rem, 1rem    + 0.75vw, 1.5rem);
  --text-xl:   clamp(1.5rem,   1.2rem  + 1.25vw, 2.25rem);
  --text-2xl:  clamp(2rem,     1.2rem  + 2.5vw,  3.5rem);

  --space-1:  0.25rem;
  --space-2:  0.5rem;
  --space-3:  0.75rem;
  --space-4:  1rem;
  --space-5:  1.25rem;
  --space-6:  1.5rem;
  --space-8:  2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;

  --radius-sm: 0.375rem;
  --radius-md: 0.5rem;
  --radius-lg: 0.75rem;
  --radius-xl: 1rem;
  --radius-2xl: 1.5rem;
  --radius-full: 9999px;

  --transition: 160ms cubic-bezier(0.16, 1, 0.3, 1);
}

[data-theme="dark"] {
  --color-bg:             #0f0f0e;
  --color-surface:        #161614;
  --color-surface-2:      #1d1c1a;
  --color-surface-3:      #242321;
  --color-border:         #2e2d2b;
  --color-divider:        #222120;
  --color-text:           #e8e6e3;
  --color-text-muted:     #7a7875;
  --color-text-faint:     #454340;
  --color-primary:        #4fa8a3;
  --color-primary-hover:  #3d908b;
  --color-primary-glow:   rgba(79,168,163,0.15);
  --color-success:        #6daa45;
  --color-success-bg:     rgba(109,170,69,0.12);
  --color-warning:        #e09b4a;
  --color-warning-bg:     rgba(224,155,74,0.12);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.5);
}

[data-theme="light"] {
  --color-bg:             #f5f4f1;
  --color-surface:        #f9f8f5;
  --color-surface-2:      #ffffff;
  --color-surface-3:      #edeae6;
  --color-border:         #d8d5d0;
  --color-divider:        #e8e5e1;
  --color-text:           #201e1a;
  --color-text-muted:     #7a7874;
  --color-text-faint:     #b0ada8;
  --color-primary:        #01696f;
  --color-primary-hover:  #0c4e54;
  --color-primary-glow:   rgba(1,105,111,0.1);
  --color-success:        #437a22;
  --color-success-bg:     rgba(67,122,34,0.1);
  --color-warning:        #964219;
  --color-warning-bg:     rgba(150,66,25,0.1);
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.07);
  --shadow-md: 0 4px 16px rgba(0,0,0,0.09);
  --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
}

/* === BASE === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-size-adjust: none;
  -webkit-text-size-adjust: none;
}
body {
  min-height: 100dvh;
  font-family: var(--font-body);
  font-size: var(--text-base);
  color: var(--color-text);
  background: var(--color-bg);
  line-height: 1.5;
  padding-bottom: env(safe-area-inset-bottom);
}
button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
img { display: block; max-width: 100%; }

/* === LAYOUT === */
.app {
  max-width: 520px;
  margin-inline: auto;
  padding: var(--space-6) var(--space-4);
  padding-top: calc(var(--space-6) + env(safe-area-inset-top, 0px));
}

/* === HEADER === */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-8);
}
.header-left {}
.app-title {
  font-size: var(--text-xl);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
  color: var(--color-text);
}
.app-date {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  margin-top: var(--space-1);
  font-weight: 500;
}
.header-actions {
  display: flex;
  gap: var(--space-2);
  align-items: center;
}
.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-full);
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-muted);
  transition: background var(--transition), color var(--transition), box-shadow var(--transition);
}
.icon-btn:hover { background: var(--color-surface-3); color: var(--color-text); }
.icon-btn:active { transform: scale(0.94); }

/* === GOAL RING === */
.goal-section {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-2xl);
  padding: var(--space-6);
  margin-bottom: var(--space-6);
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: var(--space-6);
}
.ring-container {
  position: relative;
  flex-shrink: 0;
  width: 100px;
  height: 100px;
}
.ring-svg {
  width: 100px;
  height: 100px;
  transform: rotate(-90deg);
}
.ring-track {
  fill: none;
  stroke: var(--color-border);
  stroke-width: 8;
}
.ring-progress {
  fill: none;
  stroke: var(--color-primary);
  stroke-width: 8;
  stroke-linecap: round;
  stroke-dasharray: 251.2;
  stroke-dashoffset: 251.2;
  transition: stroke-dashoffset 0.6s cubic-bezier(0.16, 1, 0.3, 1), stroke 0.4s ease;
}
.ring-center {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.ring-value {
  font-family: var(--font-mono);
  font-size: var(--text-lg);
  font-weight: 500;
  color: var(--color-text);
  line-height: 1;
  transition: color 0.4s ease;
}
.ring-unit {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  margin-top: 2px;
}
.goal-info { flex: 1; min-width: 0; }
.goal-label {
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-text-faint);
  margin-bottom: var(--space-1);
}
.goal-value {
  font-size: var(--text-2xl);
  font-family: var(--font-mono);
  font-weight: 500;
  letter-spacing: -0.02em;
  line-height: 1;
  color: var(--color-text);
  transition: color 0.4s ease;
}
.goal-subline {
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  margin-top: var(--space-1);
}
.goal-subline strong { color: var(--color-text); font-weight: 600; }
.goal-bar-wrap {
  margin-top: var(--space-3);
  height: 4px;
  background: var(--color-border);
  border-radius: var(--radius-full);
  overflow: hidden;
}
.goal-bar {
  height: 4px;
  background: var(--color-primary);
  border-radius: var(--radius-full);
  width: 0%;
  transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1), background 0.4s ease;
}

/* === STATUS BADGE === */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  font-size: var(--text-xs);
  font-weight: 600;
  padding: 3px 10px;
  border-radius: var(--radius-full);
  margin-top: var(--space-3);
  transition: background 0.4s, color 0.4s;
}
.status-badge.neutral  { background: var(--color-surface-3); color: var(--color-text-muted); }
.status-badge.on-track { background: var(--color-success-bg); color: var(--color-success); }
.status-badge.achieved { background: var(--color-success-bg); color: var(--color-success); }
.status-badge.over     { background: var(--color-primary-glow); color: var(--color-primary); }

/* === FOOD SECTION === */
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-3);
}
.section-title {
  font-size: var(--text-sm);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--color-text-faint);
}
.clear-btn {
  font-size: var(--text-xs);
  color: var(--color-text-muted);
  padding: var(--space-1) var(--space-3);
  border-radius: var(--radius-full);
  border: 1px solid var(--color-border);
  background: none;
  transition: background var(--transition), color var(--transition);
}
.clear-btn:hover { background: var(--color-surface-2); color: var(--color-text); }
.clear-btn:active { transform: scale(0.96); }

/* === FOOD GRID === */
.food-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--space-3);
  margin-bottom: var(--space-6);
}
.food-card {
  background: var(--color-surface);
  border: 1.5px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-4);
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: background var(--transition), border-color var(--transition), box-shadow var(--transition), transform var(--transition);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.food-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--color-primary-glow);
  opacity: 0;
  transition: opacity 0.3s ease;
  pointer-events: none;
}
.food-card.checked {
  border-color: var(--color-primary);
  background: var(--color-surface-2);
  box-shadow: 0 0 0 3px var(--color-primary-glow), var(--shadow-sm);
}
.food-card.checked::before { opacity: 1; }
.food-card:active { transform: scale(0.97); }

.food-check {
  position: absolute;
  top: var(--space-3);
  right: var(--space-3);
  width: 22px;
  height: 22px;
  border-radius: var(--radius-full);
  border: 1.5px solid var(--color-border);
  background: var(--color-surface-3);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background var(--transition), border-color var(--transition);
  flex-shrink: 0;
}
.food-card.checked .food-check {
  background: var(--color-primary);
  border-color: var(--color-primary);
}
.food-check svg { opacity: 0; transform: scale(0.5); transition: opacity 0.2s, transform 0.2s cubic-bezier(0.34,1.56,0.64,1); }
.food-card.checked .food-check svg { opacity: 1; transform: scale(1); }

.food-emoji { font-size: 1.6rem; margin-bottom: var(--space-2); line-height: 1; }
.food-name {
  font-size: var(--text-sm);
  font-weight: 600;
  color: var(--color-text);
  line-height: 1.2;
  padding-right: var(--space-6);
  margin-bottom: var(--space-1);
}
.food-protein {
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 500;
  color: var(--color-text-muted);
  transition: color var(--transition);
}
.food-card.checked .food-protein { color: var(--color-primary); }

.food-delete {
  position: absolute;
  bottom: var(--space-3);
  right: var(--space-3);
  width: 22px;
  height: 22px;
  border-radius: var(--radius-full);
  background: transparent;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-text-faint);
  opacity: 0;
  transition: opacity var(--transition), color var(--transition), background var(--transition);
  padding: 0;
  cursor: pointer;
  z-index: 2;
}
.food-card:hover .food-delete,
.food-card:focus-within .food-delete {
  opacity: 1;
}
.food-delete:hover {
  color: var(--color-notification, #a13544);
  background: rgba(161,53,68,0.12);
}
.food-delete:active { transform: scale(0.88); }

/* On touch devices always show delete */
@media (hover: none) {
  .food-delete { opacity: 0.45; }
}


/* === CUSTOM FOOD === */
.add-food-row {
  margin-bottom: var(--space-6);
}
.add-food-toggle {
  width: 100%;
  padding: var(--space-3) var(--space-4);
  background: var(--color-surface);
  border: 1.5px dashed var(--color-border);
  border-radius: var(--radius-xl);
  font-size: var(--text-sm);
  color: var(--color-text-muted);
  text-align: left;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  transition: background var(--transition), border-color var(--transition), color var(--transition);
}
.add-food-toggle:hover { border-color: var(--color-primary); color: var(--color-primary); background: var(--color-surface-2); }
.add-food-toggle:active { transform: scale(0.99); }

.add-food-form {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-4);
  display: none;
  flex-direction: column;
  gap: var(--space-3);
  animation: slideDown 0.2s ease;
}
.add-food-form.open { display: flex; }

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.form-row { display: flex; gap: var(--space-2); }
.form-group { display: flex; flex-direction: column; gap: var(--space-1); flex: 1; }
.form-label { font-size: var(--text-xs); font-weight: 600; color: var(--color-text-muted); }
.form-input {
  background: var(--color-surface-2);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-md);
  padding: var(--space-2) var(--space-3);
  font-size: var(--text-sm);
  color: var(--color-text);
  font-family: var(--font-body);
  transition: border-color var(--transition), box-shadow var(--transition);
  width: 100%;
}
.form-input:focus { outline: none; border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-glow); }
.form-input::placeholder { color: var(--color-text-faint); }
.form-actions { display: flex; gap: var(--space-2); justify-content: flex-end; }
.btn {
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius-md);
  font-size: var(--text-sm);
  font-weight: 600;
  transition: background var(--transition), color var(--transition), transform var(--transition);
}
.btn:active { transform: scale(0.96); }
.btn-ghost { color: var(--color-text-muted); }
.btn-ghost:hover { color: var(--color-text); background: var(--color-surface-3); }
.btn-primary {
  background: var(--color-primary);
  color: #fff;
}
.btn-primary:hover { background: var(--color-primary-hover); }

/* === GOAL EDITOR === */
.goal-editor {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-4);
  margin-bottom: var(--space-6);
  display: none;
  flex-direction: column;
  gap: var(--space-3);
  animation: slideDown 0.2s ease;
}
.goal-editor.open { display: flex; }
.goal-editor-title { font-size: var(--text-sm); font-weight: 700; color: var(--color-text); }

/* === LOG === */
.log-section { margin-top: var(--space-2); }
.log-empty {
  text-align: center;
  padding: var(--space-8);
  color: var(--color-text-faint);
  font-size: var(--text-sm);
}

/* === CHECKED LIST === */
.checked-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}
.log-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-lg);
  padding: var(--space-3) var(--space-4);
  animation: fadeIn 0.25s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}
.log-item-left { display: flex; align-items: center; gap: var(--space-3); }
.log-emoji { font-size: 1.1rem; }
.log-name { font-size: var(--text-sm); font-weight: 500; color: var(--color-text); }
.log-protein {
  font-family: var(--font-mono);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-primary);
}

/* === RESET BANNER === */
.reset-note {
  text-align: center;
  font-size: var(--text-xs);
  color: var(--color-text-faint);
  padding: var(--space-6) 0 var(--space-2);
}

/* === RESPONSIVE === */
@media (max-width: 360px) {
  .food-grid { grid-template-columns: 1fr 1fr; gap: var(--space-2); }
  .goal-section { gap: var(--space-4); }
  .ring-container, .ring-svg { width: 80px; height: 80px; }
  .goal-value { font-size: var(--text-xl); }
}

@media (hover: none) {
  .food-card:hover { background: var(--color-surface); }
}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <h1 class="app-title">Protein</h1>
      <div class="app-date" id="todayDate"></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="goalToggle" aria-label="Edit daily goal" title="Edit goal">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme" title="Toggle theme">
        <svg id="themeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Goal Editor -->
  <div class="goal-editor" id="goalEditor">
    <div class="goal-editor-title">Daily Protein Goal</div>
    <div class="form-group">
      <label class="form-label" for="goalInput">Target (grams)</label>
      <input class="form-input" type="number" id="goalInput" min="50" max="400" step="5" value="150" placeholder="e.g. 150">
    </div>
    <div class="form-actions">
      <button class="btn btn-ghost" id="goalCancel">Cancel</button>
      <button class="btn btn-primary" id="goalSave">Save Goal</button>
    </div>
  </div>

  <!-- Progress Ring -->
  <div class="goal-section">
    <div class="ring-container">
      <svg class="ring-svg" viewBox="0 0 88 88">
        <circle class="ring-track" cx="44" cy="44" r="40"/>
        <circle class="ring-progress" id="ringProgress" cx="44" cy="44" r="40"/>
      </svg>
      <div class="ring-center">
        <div class="ring-value" id="ringValue">0</div>
        <div class="ring-unit">g</div>
      </div>
    </div>
    <div class="goal-info">
      <div class="goal-label">Today's Total</div>
      <div class="goal-value" id="totalDisplay">0g</div>
      <div class="goal-subline">of <strong id="goalDisplay">150g</strong> goal</div>
      <div class="goal-bar-wrap">
        <div class="goal-bar" id="goalBar"></div>
      </div>
      <div class="status-badge neutral" id="statusBadge">
        <span id="statusText">Add food below</span>
      </div>
    </div>
  </div>

  <!-- Food Grid -->
  <div class="section-header">
    <div class="section-title">Tap to log</div>
    <button class="clear-btn" id="clearAll">Clear all</button>
  </div>

  <div class="food-grid" id="foodGrid"></div>

  <!-- Add Custom Food -->
  <div class="add-food-row">
    <button class="add-food-toggle" id="addFoodToggle">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add a food item
    </button>
    <div class="add-food-form" id="addFoodForm">
      <div class="form-row">
        <div class="form-group" style="flex:2">
          <label class="form-label" for="newFoodName">Food name</label>
          <input class="form-input" type="text" id="newFoodName" placeholder="e.g. Greek Yogurt" maxlength="30">
        </div>
        <div class="form-group" style="flex:1">
          <label class="form-label" for="newFoodProtein">Protein (g)</label>
          <input class="form-input" type="number" id="newFoodProtein" placeholder="20" min="1" max="200" step="1">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" for="newFoodEmoji">Emoji (optional)</label>
        <input class="form-input" type="text" id="newFoodEmoji" placeholder="🥩" maxlength="2">
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" id="addFoodCancel">Cancel</button>
        <button class="btn btn-primary" id="addFoodSave">Add Food</button>
      </div>
    </div>
  </div>

  <!-- Log Section -->
  <div class="log-section">
    <div class="section-header">
      <div class="section-title">Logged today</div>
    </div>
    <div id="logList">
      <div class="log-empty" id="logEmpty">Nothing logged yet</div>
    </div>
  </div>

  <div class="reset-note" id="resetNote">Resets automatically at midnight ↺</div>
</div>

<script>
// ===== DEFAULT FOODS =====
const DEFAULT_FOODS = [
  { id: 1, emoji: "🥚", name: "Eggs (2 whole)",       protein: 12 },
  { id: 2, emoji: "🍗", name: "Chicken Breast",        protein: 31 },
  { id: 3, emoji: "🐟", name: "Tuna (1 can)",          protein: 25 },
  { id: 4, emoji: "🥛", name: "Milk (250ml)",          protein: 8  },
  { id: 5, emoji: "🫘", name: "Lentils (1 cup)",       protein: 18 },
  { id: 6, emoji: "🧀", name: "Paneer (100g)",         protein: 18 },
  { id: 7, emoji: "🥜", name: "Peanut Butter (2 tbsp)",protein: 8  },
  { id: 8, emoji: "🍣", name: "Salmon (100g)",         protein: 25 },
  { id: 9, emoji: "🫙", name: "Greek Yogurt",          protein: 17 },
  { id:10, emoji: "🌱", name: "Tofu (100g)",           protein: 8  },
  { id:11, emoji: "🥩", name: "Beef (100g)",           protein: 26 },
  { id:12, emoji: "🥄", name: "Whey Protein Shake",    protein: 24 },
];

// ===== STATE =====
function getTodayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
}

function loadState() {
  try {
    const saved = localStorage.getItem('proteinTracker');
    if (saved) {
      const parsed = JSON.parse(saved);
      // If saved data is from today, restore it; otherwise start fresh
      if (parsed.date === getTodayKey()) {
        return {
          goal:   parsed.goal   ?? 150,
          foods:  parsed.foods  ?? JSON.parse(JSON.stringify(DEFAULT_FOODS)),
          checked:parsed.checked?? {},
          theme:  parsed.theme  ?? 'dark',
          nextId: parsed.nextId ?? 100,
        };
      }
    }
  } catch(e) {}
  return {
    goal: 150,
    foods: JSON.parse(JSON.stringify(DEFAULT_FOODS)),
    checked: {},
    theme: 'dark',
    nextId: 100,
  };
}

function saveState() {
  try {
    localStorage.setItem('proteinTracker', JSON.stringify({
      ...state,
      date: getTodayKey(),
    }));
  } catch(e) {}
}

let state = loadState();

// ===== THEME =====
const html = document.documentElement;
const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');

function setTheme(t) {
  state.theme = t;
  html.setAttribute('data-theme', t);
  saveState();
  themeIcon.innerHTML = t === 'dark'
    ? '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    : '<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>';
}
themeToggle.addEventListener('click', () => setTheme(state.theme === 'dark' ? 'light' : 'dark'));

// ===== DATE =====
function getToday() {
  return new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric' });
}
document.getElementById('todayDate').textContent = getToday();

// ===== RING CIRCUMFERENCE (r=40) => 2π×40 = 251.3 =====
const CIRCUMFERENCE = 2 * Math.PI * 40;
const ringProgress = document.getElementById('ringProgress');
ringProgress.style.strokeDasharray = CIRCUMFERENCE;

function updateProgress() {
  const total = getTotal();
  const goal = state.goal;
  const pct = Math.min(total / goal, 1);

  // Ring
  const offset = CIRCUMFERENCE * (1 - pct);
  ringProgress.style.strokeDashoffset = offset;

  // Color: teal → success green when achieved
  const isAchieved = total >= goal;
  ringProgress.style.stroke = isAchieved ? 'var(--color-success)' : 'var(--color-primary)';

  // Values
  document.getElementById('ringValue').textContent = total;
  document.getElementById('totalDisplay').textContent = total + 'g';
  document.getElementById('goalDisplay').textContent = goal + 'g';

  // Bar
  const bar = document.getElementById('goalBar');
  bar.style.width = Math.min(pct * 100, 100) + '%';
  bar.style.background = isAchieved ? 'var(--color-success)' : 'var(--color-primary)';

  // Status
  const badge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');
  badge.className = 'status-badge';
  if (total === 0) {
    badge.classList.add('neutral');
    statusText.textContent = 'Add food below';
  } else if (total >= goal) {
    badge.classList.add('achieved');
    statusText.textContent = '🎯 Goal achieved!';
  } else if (pct >= 0.75) {
    badge.classList.add('on-track');
    const rem = goal - total;
    statusText.textContent = rem + 'g remaining';
  } else {
    badge.classList.add('on-track');
    const rem = goal - total;
    statusText.textContent = rem + 'g to go';
  }
}

function getTotal() {
  let total = 0;
  for (const id in state.checked) {
    const food = state.foods.find(f => f.id == id);
    if (food) total += food.protein;
  }
  return total;
}

// ===== FOOD GRID =====
function renderGrid() {
  const grid = document.getElementById('foodGrid');
  grid.innerHTML = '';
  state.foods.forEach(food => {
    const checked = !!state.checked[food.id];
    const card = document.createElement('button');
    card.className = 'food-card' + (checked ? ' checked' : '');
    card.setAttribute('aria-pressed', checked);
    card.setAttribute('aria-label', food.name + ', ' + food.protein + 'g protein');
    card.innerHTML = `
      <div class="food-check">
        <svg width="11" height="11" viewBox="0 0 12 10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1,5 4.5,8.5 11,1"/>
        </svg>
      </div>
      <div class="food-emoji">${food.emoji}</div>
      <div class="food-name">${food.name}</div>
      <div class="food-protein">${food.protein}g protein</div>
      <button class="food-delete" aria-label="Remove ${food.name}" title="Remove">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/>
        </svg>
      </button>
    `;
    card.addEventListener('click', (e) => {
      if (e.target.closest('.food-delete')) return;
      toggleFood(food.id);
    });
    const delBtn = card.querySelector('.food-delete');
    delBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      deleteFood(food.id);
    });
    grid.appendChild(card);
  });
}

function toggleFood(id) {
  if (state.checked[id]) {
    delete state.checked[id];
  } else {
    state.checked[id] = true;
  }
  renderGrid();
  renderLog();
  updateProgress();
  saveState();
}


function deleteFood(id) {
  // Remove from foods list
  state.foods = state.foods.filter(f => f.id !== id);
  // Remove from checked if it was checked
  delete state.checked[id];
  renderGrid();
  renderLog();
  updateProgress();
  saveState();
}

// ===== LOG =====
function renderLog() {
  const logList = document.getElementById('logList');
  const logEmpty = document.getElementById('logEmpty');
  const checkedIds = Object.keys(state.checked).map(Number);

  if (checkedIds.length === 0) {
    logList.innerHTML = '<div class="log-empty" id="logEmpty">Nothing logged yet</div>';
    return;
  }

  const ul = document.createElement('div');
  ul.className = 'checked-list';
  checkedIds.forEach(id => {
    const food = state.foods.find(f => f.id === id);
    if (!food) return;
    const item = document.createElement('div');
    item.className = 'log-item';
    item.innerHTML = `
      <div class="log-item-left">
        <span class="log-emoji">${food.emoji}</span>
        <span class="log-name">${food.name}</span>
      </div>
      <span class="log-protein">+${food.protein}g</span>
    `;
    ul.appendChild(item);
  });
  logList.innerHTML = '';
  logList.appendChild(ul);
}

// ===== CLEAR ALL =====
document.getElementById('clearAll').addEventListener('click', () => {
  state.checked = {};
  renderGrid();
  renderLog();
  updateProgress();
  saveState();
});

// ===== GOAL EDITOR =====
const goalEditor = document.getElementById('goalEditor');
const goalToggle = document.getElementById('goalToggle');
const goalCancel = document.getElementById('goalCancel');
const goalSave   = document.getElementById('goalSave');
const goalInput  = document.getElementById('goalInput');

goalToggle.addEventListener('click', () => {
  goalInput.value = state.goal;
  goalEditor.classList.toggle('open');
});
goalCancel.addEventListener('click', () => goalEditor.classList.remove('open'));
goalSave.addEventListener('click', () => {
  const v = parseInt(goalInput.value);
  if (v >= 50 && v <= 400) {
    state.goal = v;
    updateProgress();
    goalEditor.classList.remove('open');
    saveState();
  }
});

// ===== ADD FOOD =====
const addFoodToggle = document.getElementById('addFoodToggle');
const addFoodForm   = document.getElementById('addFoodForm');
const addFoodCancel = document.getElementById('addFoodCancel');
const addFoodSave   = document.getElementById('addFoodSave');

addFoodToggle.addEventListener('click', () => {
  addFoodForm.classList.toggle('open');
  if (addFoodForm.classList.contains('open')) {
    document.getElementById('newFoodName').focus();
  }
});
addFoodCancel.addEventListener('click', () => addFoodForm.classList.remove('open'));
addFoodSave.addEventListener('click', () => {
  const name    = document.getElementById('newFoodName').value.trim();
  const protein = parseInt(document.getElementById('newFoodProtein').value);
  const emoji   = document.getElementById('newFoodEmoji').value.trim() || '🍽️';
  if (!name || isNaN(protein) || protein < 1) return;
  const newFood = { id: state.nextId++, emoji, name, protein };
  state.foods.push(newFood);
  document.getElementById('newFoodName').value = '';
  document.getElementById('newFoodProtein').value = '';
  document.getElementById('newFoodEmoji').value = '';
  addFoodForm.classList.remove('open');
  renderGrid();
  saveState();
});

// Enter key shortcuts
document.getElementById('newFoodProtein').addEventListener('keydown', e => {
  if (e.key === 'Enter') addFoodSave.click();
});
goalInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') goalSave.click();
});

// ===== INIT =====
setTheme(state.theme);
renderGrid();
renderLog();
updateProgress();

// Show last reset date in footer
const resetNote = document.getElementById('resetNote');
const saved = (() => { try { return JSON.parse(localStorage.getItem('proteinTracker')); } catch(e){} return null; })();
if (saved && saved.date !== getTodayKey()) {
  resetNote.textContent = 'Fresh start — last session was ' + saved.date + ' ↺';
} else {
  resetNote.textContent = 'Resets automatically at midnight ↺';
}
</script>
</body>
</html>
